name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @workflow-pro/database build
          pnpm --filter @workflow-pro/auth-sdk build

      - name: Typecheck
        run: |
          pnpm --filter @workflow-pro/worker typecheck
          pnpm --filter frontend typecheck

      - name: Lint
        run: |
          pnpm --filter worko lint
          pnpm --filter frontend lint

      - name: Build apps
        run: |
          pnpm --filter worko build
          pnpm --filter @workflow-pro/worker build
          pnpm --filter frontend build

      - name: Test
        run: pnpm --filter worko test
