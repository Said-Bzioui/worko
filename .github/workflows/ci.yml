name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: worko_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d worko_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/worko_test?sslmode=disable
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_API_KEY: ci-test-api-key
      ARCJET_KEY: ci-test-key
      ARCJET_ENV: test
      OBSERVE_APP_KEY: ci-test-key
      OBSERVE_APP_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDKs
        run: |
          pnpm --filter @said-bzioui/database build
          pnpm --filter @said-bzioui/auth-sdk build

      - name: Typecheck
        run: |
          pnpm --filter @said-bzioui/worker typecheck
          pnpm --filter frontend typecheck

      - name: Lint
        run: |
          pnpm --filter worko lint
          pnpm --filter frontend lint

      - name: Build apps
        run: |
          pnpm --filter worko build
          pnpm --filter @said-bzioui/worker build
          pnpm --filter frontend build

      - name: Prepare test database
        run: pnpm --filter @said-bzioui/database prisma:deploy

      - name: Run tests
        run: |
          pnpm --filter @said-bzioui/database test
          pnpm --filter worko test

      - name: Validate package manifests
        run: |
          node -e "
            const fs = require('fs');
            const pkgs = [
              'packages/database/package.json',
              'packages/auth-sdk/package.json',
            ];
            for (const p of pkgs) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (!pkg.name) throw new Error(p + ': missing name');
              if (!pkg.version) throw new Error(p + ': missing version');
              if (pkg.private !== false) throw new Error(p + ': must be publishable');
              if (pkg.publishConfig?.registry !== 'https://npm.pkg.github.com') throw new Error(p + ': wrong registry');
              if (!pkg.name.startsWith('@said-bzioui/')) throw new Error(p + ': package scope must match GitHub owner');
              if (pkg.publishConfig?.name && pkg.publishConfig.name !== pkg.name) throw new Error(p + ': canonical and published names must match');
              if (!pkg.exports || !pkg.files?.includes('dist')) throw new Error(p + ': exports or dist whitelist missing');
              console.log('✓', pkg.name, pkg.version);
            }
          "

      - name: Validate Changesets config
        run: |
          node -e "
            const cfg = JSON.parse(require('fs').readFileSync('.changeset/config.json', 'utf8'));
            if (cfg.baseBranch !== 'main') throw new Error('baseBranch must be main');
            if (cfg.fixed?.length > 0) throw new Error('fixed packages must be empty (independent versioning)');
            if (cfg.linked?.length > 0) throw new Error('linked packages must be empty (independent versioning)');
            if (cfg.access !== 'restricted') throw new Error('GitHub Packages releases must use restricted access');
            console.log('✓ Changesets config valid');
          "
