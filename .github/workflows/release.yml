name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1 — When changesets exist: open/update Version Packages PR
  # Job 2 — When no changesets exist (after merging release PR): publish
  # ─────────────────────────────────────────────────────────────────
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: worko_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d worko_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/worko_test?sslmode=disable
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_API_KEY: ci-test-api-key
      ARCJET_KEY: ci-test-key
      ARCJET_ENV: test
      OBSERVE_APP_KEY: ci-test-key
      OBSERVE_APP_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@said-bzioui"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDKs
        run: |
          pnpm --filter @said-bzioui/database build
          pnpm --filter @said-bzioui/auth-sdk build

      - name: Build backend (compile check)
        run: pnpm --filter worko build

      - name: Prepare test database
        run: pnpm --filter @said-bzioui/database prisma:deploy

      - name: Run tests
        run: |
          pnpm --filter @said-bzioui/database test
          pnpm --filter worko test

      # changesets/action handles two states automatically:
      #   1. Changesets present  → opens/updates "Version Packages" PR
      #   2. No changesets       → publishes to registry (after merging PR)
      - name: Create Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish SDKs
        id: publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release:publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}

      # ── Post-publish: create independent Git tags ──────────────────
      - name: Create version tags
        if: steps.publish.outcome == 'success'
        env:
          PUBLISHED: ${{ steps.publish.outputs.publishedPackages }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const packages = JSON.parse(process.env.PUBLISHED);
            for (const { name, version } of packages) {
              const slug = name.replace(/^@said-bzioui\//, "");
              const tag = `${slug}-v${version}`;
              try { execFileSync("git", ["rev-parse", "-q", "--verify", `refs/tags/${tag}`]); }
              catch { execFileSync("git", ["tag", tag]); }
              execFileSync("git", ["push", "origin", `refs/tags/${tag}`], { stdio: "inherit" });
              try { execFileSync("gh", ["release", "view", tag], { stdio: "ignore" }); }
              catch { execFileSync("gh", ["release", "create", tag, "--verify-tag", "--title", `${name}@${version}`, "--generate-notes"], { stdio: "inherit" }); }
              console.log(`Verified release ${tag}`);
            }
          '
